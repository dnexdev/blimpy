; Blimpy gondola firmware — ESP32-C3 SuperMini
; Build/flash:  pio run -t upload   |  Serial monitor:  pio device monitor
; First time: copy include/secrets.h.example -> include/secrets.h and fill in the hotspot creds.
[platformio]
default_envs = esp32-c3-supermini    ; plain `pio run` builds the board only

; Host-side logic tests (mixer, failsafe, command parsing; no board):  pio test -e native
[env:native]
platform = native
build_flags = -std=c++17 -Iinclude
build_src_filter = -<*>              ; tests only; src/main.cpp needs Arduino
lib_deps = bblanchon/ArduinoJson@^7.0

[env:esp32-c3-supermini]
platform = espressif32@7.1.3         ; pinned so every laptop builds the same Arduino core; main.cpp handles core 2.x and 3.x
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.flash_mode = dio          ; SuperMini clones need this or they boot-loop
test_ignore = *                       ; logic tests run on the host env only
build_flags =
  -DARDUINO_USB_MODE=1                ; log over the native USB port
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  bblanchon/ArduinoJson@^7.0
  pololu/VL53L0X@^1.3.1
